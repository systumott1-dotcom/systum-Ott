name: Render Backend 24/7 Keep-Alive

on:
  schedule:
    # Runs every 10 minutes (cron schedule in UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "Pinging Systum OTT Render backend at https://systum-ott.onrender.com/api/health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://systum-ott.onrender.com/api/health)
          echo "HTTP Response Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ] || [ "$HTTP_STATUS" -eq 302 ]; then
            echo "✅ Render backend is ONLINE and AWAKE!"
          else
            echo "⚠️ Unexpected status: $HTTP_STATUS. Retrying in 5 seconds..."
            sleep 5
            curl -s https://systum-ott.onrender.com/api/health
          fi
